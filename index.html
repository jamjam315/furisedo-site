<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フリセド | フリマ・せどりの損益管理</title>
<meta name="description" content="フリセド（フリマ・せどりの損益管理）の案内ページです。">
<!-- 正式公開まで検索結果に出さない（plan.md §9「事前告知・SNS発信をしない」）。
     公開時にこの行を消し、ストアリンクを入れる。 -->
<meta name="robots" content="noindex">
<link rel="canonical" href="https://furisedo.com/">
<style>
  :root {
    --yamabuki: #D9930D;
    --sumi: #221F1A;
    --kinari: #FAF7F0;
    --text: #221F1A;
    --text-sub: #5E574D;
    --line: #E7E0D2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--kinari);
    color: var(--text);
    line-height: 1.9;
    -webkit-text-size-adjust: 100%;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main { flex-grow: 1; max-width: 680px; margin: 0 auto; padding: 72px 24px 48px; }
  .mark {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    background: var(--yamabuki);
    overflow: hidden;
  }
  .mark svg { width: 100%; height: 100%; display: block; }
  h1 { font-size: 34px; margin: 22px 0 0; letter-spacing: 0.02em; }
  .tagline { font-size: 17px; color: var(--text-sub); margin-top: 6px; }
  .pitch { font-size: 16px; margin-top: 28px; }
  .store {
    margin-top: 36px;
    padding: 18px 20px;
    border: 2px dashed var(--line);
    border-radius: 12px;
    font-size: 14px;
    color: var(--text-sub);
  }
  nav { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 14px 24px; }
  nav a {
    color: var(--sumi);
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    border-bottom: 2px solid var(--yamabuki);
    padding-bottom: 2px;
  }
  nav a:hover { color: #A06A05; }
  footer {
    background: var(--sumi);
    color: var(--kinari);
    font-size: 13px;
    padding: 20px 24px;
  }
  footer .inner { max-width: 680px; margin: 0 auto; }
  footer a { color: var(--yamabuki); }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><polygon points="150,168 372,150 262,368 186,372 306,208 150,222" fill="#221F1A"></polygon></svg>
  </div>
  <h1>フリセド</h1>
  <p class="tagline">フリマ・せどりの損益管理</p>

  <p class="store">
    Google Play で公開の準備中です。公開後、ここにリンクを掲載します。
  </p>

  <nav>
    <a href="/privacy/">プライバシーポリシー</a>
    <a href="/disclaimer/">免責事項</a>
    <a href="mailto:info@furisedo.com">お問い合わせ</a>
  </nav>
</main>
<footer>
  <div class="inner">
    MTP Works　<a href="mailto:info@furisedo.com">info@furisedo.com</a>
  </div>
</footer>
</body>
</html>
